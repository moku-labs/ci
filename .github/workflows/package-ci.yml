name: Package CI

# Reusable check suite for every moku-family npm package.
#
# It calls ONLY the contract scripts (lint / typecheck / test / build / validate). Anything
# project-specific — a second typecheck pass, a bundle-size gate, a sandbox run — belongs
# INSIDE the project's own script, not in this file. That is what keeps one central copy
# viable for seven repos.
#
# Reusable-workflow facts that matter here:
#   - `github.workflow` is the CALLER's workflow name ("CI" or "Release"), not this file's.
#   - `github.event_name` / `github.ref` are the caller's too.
#   - The caller must NOT set its own `concurrency` for the CI path: the group below is
#     already caller-scoped, and a caller using the same group would deadlock against it.
on:
  workflow_call:
    inputs:
      runs_on:
        description: Runner label for every job.
        type: string
        required: false
        default: ubuntu-latest
      bun_version:
        description: Bun version passed to setup-bun ("latest", or a pin like "1.3.8").
        type: string
        required: false
        default: latest
      validate:
        description: Run `bun run validate` (publint + attw) after the build.
        type: boolean
        required: false
        default: true

# Scope the group by github.workflow: a release's reuse of CI runs under the "Release"
# workflow name, so it never shares a group with — and never cancels — a standalone CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read # workflow-level least privilege; no job here needs more

jobs:
  lint:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun_version }}
      - run: bun install --frozen-lockfile
      - run: bun run lint # biome check (incl. format) + eslint

  types:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun_version }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck # tsc --noEmit; a package needing two passes chains them here

  test:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun_version }}
      - run: bun install --frozen-lockfile
      - run: bun run test # vitest run — NOT `bun test` (bun bleeds module mocks across files)

  build:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun_version }}
      - run: bun install --frozen-lockfile
      - run: bun run build # tsdown — index + cli entries
      - if: inputs.validate
        run: bun run validate # publint + attw (node16 profile)

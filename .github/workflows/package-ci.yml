name: Package CI

# Reusable check suite for every moku-family npm package.
#
# It calls ONLY the contract scripts (lint / typecheck / test / build / validate). Anything
# project-specific — a second typecheck pass, a bundle-size gate, a sandbox run — belongs
# INSIDE the project's own script, not in this file. That is what keeps one central copy
# viable for seven repos.
#
# Reusable-workflow facts that matter here:
#   - `github.workflow` is the CALLER's workflow name ("CI" or "Release"), not this file's.
#   - `github.event_name` / `github.ref` are the caller's too.
#   - The caller must NOT set its own `concurrency` for the CI path: the group below is
#     already caller-scoped, and a caller using the same group would deadlock against it.
on:
  workflow_call:
    inputs:
      runs_on:
        description: Runner label for every job.
        type: string
        required: false
        default: ubuntu-latest
      bun_version:
        description: Bun version passed to setup-bun ("latest", or a pin like "1.3.8").
        type: string
        required: false
        default: latest
      validate:
        description: Run `bun run validate` (publint + attw) after the build.
        type: boolean
        required: false
        default: true
      preview:
        description: Publish a pkg.pr.new preview of every pull request commit.
        type: boolean
        required: false
        default: true
      extra:
        description: >-
          JSON array of extra package.json scripts, one job each, run after a build:
          '["check:bundle", "test:cli-e2e"]'. For project checks the five contract scripts do
          not cover.
        type: string
        required: false
        default: "[]"

# Scope the group by github.workflow: a release's reuse of CI runs under the "Release"
# workflow name, so it never shares a group with — and never cancels — a standalone CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read # workflow-level least privilege; no job here needs more

jobs:
  lint:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Refuse pkg.pr.new preview dependencies
        # A preview URL is for local testing only. It must never reach main: the tarball
        # has no provenance and the URL dies with the PR.
        run: |
          set -euo pipefail
          if grep -n 'pkg\.pr\.new' package.json; then
            echo "package.json depends on a pkg.pr.new preview — release the upstream package first"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun_version }}
      - run: bun install --frozen-lockfile
      - run: bun run lint # biome check (incl. format) + eslint

  types:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun_version }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck # tsc --noEmit; a package needing two passes chains them here

  test:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun_version }}
      - run: bun install --frozen-lockfile
      - run: bun run test # vitest run — NOT `bun test` (bun bleeds module mocks across files)

  build:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # tags: a package.json with no `version` is seeded from the latest one
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun_version }}
      - run: bun install --frozen-lockfile
      - run: bun run build # tsdown — index + cli entries
      - name: Seed the version from the latest tag when package.json has none
        # Some packages keep the version in git tags only. publint and pkg.pr.new pack a
        # tarball, and a tarball needs a version. Never committed, never published.
        run: |
          set -euo pipefail
          if [ -n "$(bun -e 'console.log(require("./package.json").version ?? "")')" ]; then exit 0; fi
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          latest="${latest#v}"
          npm version "${latest:-0.0.0}" --no-git-tag-version --allow-same-version >/dev/null
      - if: inputs.validate
        run: bun run validate # publint + attw (node16 profile)

  # Project-specific checks, one job per script: `ci / extra (check:bundle)`. Each runs after
  # its own build, because such a check usually reads dist/. The release path runs them too.
  extra:
    if: inputs.extra != '[]'
    runs-on: ${{ inputs.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJSON(inputs.extra) }}
    env:
      SCRIPT: ${{ matrix.script }} # caller input -> env, never inline in run
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun_version }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run "$SCRIPT"

  # Preview of the PR's package on pkg.pr.new — nothing is published to npm, no token is in
  # scope. Needs the pkg.pr.new GitHub App on the repo. NOT a required check (rulesets/main.json).
  # Skipped on push and on the release path: there `github.event_name` is the caller's
  # workflow_dispatch / release, never pull_request.
  preview:
    needs: build
    if: inputs.preview && github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # tags, for the version seed below
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun_version }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Seed the version from the latest tag when package.json has none
        run: |
          set -euo pipefail
          if [ -n "$(bun -e 'console.log(require("./package.json").version ?? "")')" ]; then exit 0; fi
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          latest="${latest#v}"
          npm version "${latest:-0.0.0}" --no-git-tag-version --allow-same-version >/dev/null
      # Pinned: a floating bunx would run new third-party code in every moku repo.
      - run: bunx pkg-pr-new@0.0.88 publish --comment=update --packageManager=bun
